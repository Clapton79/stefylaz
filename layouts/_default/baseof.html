<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }} | {{ .Site.Title }}</title>
    <style>
        body { font-family: 'Georgia', serif; line-height: 1.6; color: #2D3748; max-width: 800px; margin: 0 auto; padding: 20px; background-color: #FFFDFB; text-align: center; }
        nav { margin-bottom: 40px; border-bottom: 1px solid #E2E8F0; padding-bottom: 20px; }
        nav a { margin: 0 15px; text-decoration: none; color: #4A5568; font-weight: bold; }
        h1, h2 { color: #1A202C; font-weight: normal; }
        footer { margin-top: 60px; font-size: 0.9em; color: #718096; border-top: 1px solid #E2E8F0; padding-top: 20px; }
    </style>
</head>
<body>
    <header>
        <h1>{{ .Site.Title }}</h1>
        <nav>
            <a href="/">Home</a>
            <a href="/rsvp/">RSVP</a>
        </nav>
    </header>
    <main>
        {{ block "main" . }}{{ end }}
    </main>
    <footer>
        <p>❤️ Built with love. See you on September 18, 2027!</p>
    </footer>
</body>
</html>
